name: Update encoder tables

on:
  schedule:
    - cron: "0 * * * 1-5"
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-encoder-tables
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ matrix.go_package }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_package: com.nexon.bluearchive
            go_package: arona
            make_target: generate-arona
            check_target: check-arona
            output: pkg/encoder/arona/table_gen.go
          - android_package: com.YostarJP.BlueArchive
            go_package: plana
            make_target: generate-plana
            check_target: check-plana
            output: pkg/encoder/plana/table_gen.go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Download generator inputs
        id: inputs
        shell: bash
        env:
          ANDROID_PACKAGE: ${{ matrix.android_package }}
        run: |
          set -euo pipefail
          input_dir="libraries/${ANDROID_PACKAGE}"
          mkdir -p "${input_dir}"
          curl_args=(--fail --show-error --silent --location --connect-timeout 15 --max-time 900)

          curl "${curl_args[@]}" \
            "https://ba.pokeguy.dev/${ANDROID_PACKAGE}/version.txt" \
            --output "${input_dir}/version.txt"
          version="$(tr -d '\r\n' < "${input_dir}/version.txt")"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid version received for ${ANDROID_PACKAGE}: ${version}" >&2
            exit 1
          fi

          curl "${curl_args[@]}" \
            "https://ba.pokeguy.dev/${ANDROID_PACKAGE}/decompiled/${version}/offset.txt" \
            --output "${input_dir}/offset.txt"
          if [[ ! -s "${input_dir}/offset.txt" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            echo "No dispatcher offset is available for ${ANDROID_PACKAGE} ${version}"
            exit 0
          fi

          curl "${curl_args[@]}" \
            "https://ba.pokeguy.dev/${ANDROID_PACKAGE}/libraries/${version}/libil2cpp.so" \
            --output "${input_dir}/libil2cpp.so"
          if [[ ! -s "${input_dir}/libil2cpp.so" ]]; then
            echo "Downloaded library is empty for ${ANDROID_PACKAGE} ${version}" >&2
            exit 1
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install native build tools
        if: steps.inputs.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential

      - name: Generate table
        if: steps.inputs.outputs.skip == 'false'
        run: make ${{ matrix.make_target }}

      - name: Verify generated table
        if: steps.inputs.outputs.skip == 'false'
        run: make ${{ matrix.check_target }}

      - name: Test runtime package
        if: steps.inputs.outputs.skip == 'false'
        run: go test ./pkg/encoder/${{ matrix.go_package }} -count=1

      - name: Test generator tools
        if: steps.inputs.outputs.skip == 'false'
        run: make test-tools

      - name: Create pull request
        if: steps.inputs.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "feat(${{ matrix.go_package }}): update encoder table to ${{ steps.inputs.outputs.version }}"
          body: "Generated from ${{ matrix.android_package }} version ${{ steps.inputs.outputs.version }}."
          branch: "feat/update-${{ matrix.go_package }}-table-${{ steps.inputs.outputs.version }}"
          delete-branch: true
          labels: needs-review
          commit-message: "feat(${{ matrix.go_package }}): update encoder table to ${{ steps.inputs.outputs.version }}"
          add-paths: ${{ matrix.output }}
