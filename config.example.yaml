emulator:
  pool_size: 10
  timeout: 30            # Timeout in seconds for each encoding operation

encoders:
  japan:
    binary: "libraries/japan/libil2cpp.so"
    offset: 0                # Offset value (0 is valid)
    aliases:
      - "j"
      - "jp"
      - "jpn"
    # pool_size: 10          # Optional: Override emulator pool_size
    # timeout: 30            # Optional: Override emulator timeout
  global:
    binary: "libraries/global/libil2cpp.so"
    offset: 0                # Offset value (0 is valid)
    aliases:
      - "g"
      - "gl"
    # pool_size: 10          # Optional: Override emulator pool_size
    # timeout: 30            # Optional: Override emulator timeout
