name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  GO_VERSION: '1.25.x'
  UNICORN_VERSION: 'v2.1.4'
  UNICORN_ARCHS: 'x86;aarch64;arm;mips;ppc;riscv;sparc;s390x;tricore'

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux
            ext: ""
          - os: windows-latest
            arch: amd64
            platform: windows
            ext: ".exe"
            msystem: MINGW64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Use Unicorn tag
      run: |
        git -C unicorn fetch --tags --force
        git -C unicorn checkout "${{ env.UNICORN_VERSION }}"
        git -C unicorn submodule update --init --recursive
        git -C unicorn rev-parse --short HEAD
      shell: bash

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install build deps (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential pkg-config
      shell: bash

    - name: Setup MSYS2 (Windows)
      if: matrix.platform == 'windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          git
          p7zip
          make

    - name: Configure & build Unicorn (Linux)
      if: matrix.platform == 'linux'
      run: |
        cmake -S unicorn -B build/unicorn -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DUNICORN_BUILD_SHARED=ON \
          -DUNICORN_ARCH="${{ env.UNICORN_ARCHS }}"
        cmake --build build/unicorn --config Release -j$(nproc)
      shell: bash

    - name: Configure & build Unicorn (Windows)
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        cmake -S unicorn -B build/unicorn -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DUNICORN_BUILD_SHARED=ON \
          -DUNICORN_ARCH="${{ env.UNICORN_ARCHS }}"
        cmake --build build/unicorn --config Release

    - name: Apply patches (Linux)
      if: matrix.platform == 'linux'
      shell: bash
      run: ./scripts/apply_patch.sh

    - name: Apply patches (Windows)
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: ./scripts/apply_patch.sh

    - name: Export cgo flags (Linux)
      if: matrix.platform == 'linux'
      run: |
        echo "CGO_CFLAGS=-I${{ github.workspace }}/unicorn/include" >> $GITHUB_ENV
        echo "CGO_LDFLAGS=-L${{ github.workspace }}/build/unicorn -lunicorn" >> $GITHUB_ENV
      shell: bash

    - name: Export cgo flags (Windows)
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        echo "CGO_CFLAGS=-I$(cygpath -m '${{ github.workspace }}')/unicorn/include" >> $GITHUB_ENV
        echo "CGO_LDFLAGS=-L$(cygpath -m '${{ github.workspace }}')/build/unicorn -lunicorn" >> $GITHUB_ENV

    - name: Build application (Linux)
      if: matrix.platform == 'linux'
      run: |
        export CGO_ENABLED=1
        export GOOS=${{ matrix.platform }}
        export GOARCH=${{ matrix.arch }}
        export LD_LIBRARY_PATH="${{ github.workspace }}/build/unicorn:$LD_LIBRARY_PATH"
        go build -v -trimpath -ldflags="-s -w" -o protocol-encoder${{ matrix.ext }} ./main.go
      shell: bash

    - name: Build application (Windows)
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        export CGO_ENABLED=1
        export GOOS=${{ matrix.platform }}
        export GOARCH=${{ matrix.arch }}
        go build -v -trimpath -ldflags="-s -w" -o protocol-encoder${{ matrix.ext }} ./main.go

    - name: Package artifacts (Linux)
      if: matrix.platform == 'linux'
      run: |
        mkdir -p dist
        cp protocol-encoder${{ matrix.ext }} dist/
        cp build/unicorn/libunicorn.so* dist/
        tar -C dist -czf "protocol-encoder-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" .
      shell: bash

    - name: Package artifacts (Windows)
      if: matrix.platform == 'windows'
      shell: msys2 {0}
      run: |
        mkdir -p dist
        cp protocol-encoder${{ matrix.ext }} dist/
        cp build/unicorn/libunicorn.dll dist/ || cp build/unicorn/unicorn.dll dist/
        cd dist
        7z a -tzip "../protocol-encoder-${{ matrix.platform }}-${{ matrix.arch }}.zip" .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: protocol-encoder-${{ matrix.platform }}-${{ matrix.arch }}
        path: |
          protocol-encoder-*.zip
          protocol-encoder-*.tar.gz
        if-no-files-found: ignore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential pkg-config

    - name: Build Unicorn for tests
      run: |
        git -C unicorn fetch --tags --force
        git -C unicorn checkout "${{ env.UNICORN_VERSION }}"
        git -C unicorn submodule update --init --recursive
        cmake -S unicorn -B build/unicorn -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DUNICORN_BUILD_SHARED=ON \
          -DUNICORN_ARCH="${{ env.UNICORN_ARCHS }}"
        cmake --build build/unicorn --config Release

    - name: Run unit tests
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/unicorn
        CGO_CFLAGS: -I${{ github.workspace }}/unicorn/include
        CGO_LDFLAGS: -L${{ github.workspace }}/build/unicorn -lunicorn
      run: |
        go test -v -race -coverprofile=coverage.out ./...

    - name: Lint
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        golangci-lint run

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.out

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/*/protocol-encoder-*.zip
          artifacts/*/protocol-encoder-*.tar.gz
        generate_release_notes: true
