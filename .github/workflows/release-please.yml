name: Release Please

on:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  release-please:
    name: Manage release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Build release artifacts
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    # The tag is pushed with GITHUB_TOKEN, which never triggers another
    # workflow, so the release build is called directly instead of relying on
    # the tag push trigger in release.yml.
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
